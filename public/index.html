<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vernacular Coffee Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Vernacular Coffee Cart</h1>
            <p class="subtitle">Order Taking View</p>
        </header>

        <main>
            <form id="order-form">
                <section>
                    <h2>Choose Your Coffee</h2>
                    <div class="menu-items" id="coffee-items">
                        <div class="menu-item">
                            <div class="menu-item-header">
                                <input type="checkbox" id="hot-black" name="coffeeType" value="Hot Black Coffee">
                                <label for="hot-black">Hot Black Coffee</label>
                            </div>
                            <div class="quantity-control" id="hot-black-quantity" style="display: none;">
                                <button type="button" class="qty-btn minus" data-item="hot-black">−</button>
                                <input type="number" class="qty-input" id="hot-black-qty" value="1" min="1" max="5" readonly>
                                <button type="button" class="qty-btn plus" data-item="hot-black">+</button>
                            </div>
                        </div>

                        <div class="menu-item">
                            <div class="menu-item-header">
                                <input type="checkbox" id="hot-white" name="coffeeType" value="Hot White Coffee">
                                <label for="hot-white">Hot White Coffee</label>
                            </div>
                            <div class="quantity-control" id="hot-white-quantity" style="display: none;">
                                <button type="button" class="qty-btn minus" data-item="hot-white">−</button>
                                <input type="number" class="qty-input" id="hot-white-qty" value="1" min="1" max="5" readonly>
                                <button type="button" class="qty-btn plus" data-item="hot-white">+</button>
                            </div>
                        </div>
                        
                        <div class="menu-item">
                            <div class="menu-item-header">
                                <input type="checkbox" id="hot-white-oat" name="coffeeType" value="Hot White Coffee with Oat Milk">
                                <label for="hot-white-oat">Hot White Coffee with Oat Milk</label>
                            </div>
                            <div class="quantity-control" id="hot-white-oat-quantity" style="display: none;">
                                <button type="button" class="qty-btn minus" data-item="hot-white-oat">−</button>
                                <input type="number" class="qty-input" id="hot-white-oat-qty" value="1" min="1" max="5" readonly>
                                <button type="button" class="qty-btn plus" data-item="hot-white-oat">+</button>
                            </div>
                        </div>

                        <div class="menu-item">
                            <div class="menu-item-header">
                                <input type="checkbox" id="iced-black" name="coffeeType" value="Iced Black Coffee">
                                <label for="iced-black">Iced Black Coffee</label>
                            </div>
                            <div class="quantity-control" id="iced-black-quantity" style="display: none;">
                                <button type="button" class="qty-btn minus" data-item="iced-black">−</button>
                                <input type="number" class="qty-input" id="iced-black-qty" value="1" min="1" max="5" readonly>
                                <button type="button" class="qty-btn plus" data-item="iced-black">+</button>
                            </div>
                        </div>

                        <div class="menu-item">
                            <div class="menu-item-header">
                                <input type="checkbox" id="iced-white" name="coffeeType" value="Iced White Coffee">
                                <label for="iced-white">Iced White Coffee</label>
                            </div>
                            <div class="quantity-control" id="iced-white-quantity" style="display: none;">
                                <button type="button" class="qty-btn minus" data-item="iced-white">−</button>
                                <input type="number" class="qty-input" id="iced-white-qty" value="1" min="1" max="5" readonly>
                                <button type="button" class="qty-btn plus" data-item="iced-white">+</button>
                            </div>
                        </div>
                        
                        <div class="menu-item">
                            <div class="menu-item-header">
                                <input type="checkbox" id="iced-white-oat" name="coffeeType" value="Iced White Coffee with Oat Milk">
                                <label for="iced-white-oat">Iced White Coffee with Oat Milk</label>
                            </div>
                            <div class="quantity-control" id="iced-white-oat-quantity" style="display: none;">
                                <button type="button" class="qty-btn minus" data-item="iced-white-oat">−</button>
                                <input type="number" class="qty-input" id="iced-white-oat-qty" value="1" min="1" max="5" readonly>
                                <button type="button" class="qty-btn plus" data-item="iced-white-oat">+</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <h2>Your Name</h2>
                    <input type="text" id="customer-name" name="customerName" placeholder="Enter your name" required>
                </section>

                <button type="submit" class="submit-btn">Place Order</button>
            </form>
        </main>

        <footer>
            <p><a href="/barista" class="barista-link">Barista View</a></p>
            <p class="copyright"> 2025 Vernacular Coffee Cart</p>
        </footer>
    </div>

    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Thank You!</h2>
            <p>Your order has been placed and the barista will prepare it shortly.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/order.js"></script>
</body>
</html>
